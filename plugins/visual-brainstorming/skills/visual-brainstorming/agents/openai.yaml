interface:
  display_name: "Visual Brainstorming"
  short_description: "看懂项目结构 + 比较点选视觉方案"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#5B5CE2"
  default_prompt: "理解模式：提炼当前项目的真实结构并画成架构图（先提炼、后画图，默认导出单文件到 local/）；决策模式：把 2–3 个结构不同的候选方案在本地浏览器并排展示并记录选择。"
policy:
  allow_implicit_invocation: true
